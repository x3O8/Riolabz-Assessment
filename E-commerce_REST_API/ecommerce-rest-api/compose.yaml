x-app: &app-or-seed
  build: .
  depends_on:
    mongo:
      condition: service_healthy
  init: true
  environment: &app-env
    MONGODB_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0&directConnection=true
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
    AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
    LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (error) {
            if (error.codeName !== 'NotYetInitialized') throw error;
            rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]});
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    <<: *app-or-seed
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  seed-admin:
    <<: *app-or-seed
    profiles: ["tools"]
    command: ["npm", "run", "seed:admin"]
    environment:
      <<: *app-env
      ADMIN_NAME: ${ADMIN_NAME:-Store Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  mongo-data:
